<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>LPRK Admin</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
<main>

  <!-- Ingreso -->
  <div id="login" class="box login">
    <h2>Panel admin</h2>
    <form id="loginForm">
      <input id="password" type="password" placeholder="Contraseña" required>
      <br><br>
      <button class="btn">Entrar</button>
    </form>
    <p id="loginError" class="error"></p>
  </div>

  <!-- Panel -->
  <div id="app" hidden>
    <div class="topbar">
      <h2>LPRK Admin</h2>
      <div>
        <a class="btn outline" href="index.html">Ver tienda</a>
        <button class="btn outline" id="logout" type="button">Salir</button>
      </div>
    </div>

    <div class="tabs">
      <button class="btn" data-tab="summary" type="button">Resumen</button>
      <button class="btn outline" data-tab="products" type="button">Productos</button>
      <button class="btn outline" data-tab="orders" type="button">Pedidos</button>
    </div>

    <section id="summary" class="tab"></section>

    <section id="products" class="tab" hidden>
      <div class="box">
        <form class="form-grid" id="productForm">
          <input name="name" placeholder="Nombre" required>
          <input name="price" type="number" min="0" placeholder="Precio" required>
          <input name="sizes" placeholder="Talles (S, M, L)">
          <select name="category">
            <option>Remeras</option><option>Pantalones</option><option>Camperas</option>
            <option>Vestidos</option><option>Calzado</option><option>Accesorios</option>
          </select>
          <input name="stock" type="number" min="0" placeholder="Stock" required>
          <input name="img" type="file" accept="image/*">
          <button class="btn">Publicar</button>
        </form>
      </div>
      <div class="box table-wrap">
        <table class="responsive">
          <thead><tr><th></th><th>Producto</th><th>Precio</th><th>Stock</th><th>Categoría</th><th></th></tr></thead>
          <tbody id="productList"></tbody>
        </table>
      </div>
    </section>

    <section id="orders" class="tab" hidden>
      <div class="box table-wrap">
        <table class="responsive">
          <thead><tr><th>Código</th><th>Fecha</th><th>Cliente</th><th>Teléfono</th><th>Producto</th><th>Total</th><th>Estado</th></tr></thead>
          <tbody id="orderList"></tbody>
        </table>
      </div>
    </section>
  </div>

</main>
<script type="module" src="js/admin.js"></script>
</body>
</html>
